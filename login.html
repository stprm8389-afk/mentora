<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentora - Sign in</title>
<style>
  body{font-family:sans-serif;background:#f4f6fb;display:flex;justify-content:center;padding:20px}
  .card{background:#fff;max-width:380px;width:100%;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0002}
  input,select,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
  button{background:#3b5bdb;color:#fff;border:0;border-radius:8px}
  .link{background:none;color:#3b5bdb;padding:6px}
  #msg{color:#c92a2a;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <h2 id="title">Log in to Mentora</h2>
  <div id="signupOnly" style="display:none">
    <input id="name" placeholder="Your name">
    <select id="role">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="parent">Parent</option>
    </select>
  </div>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <p id="msg"></p>
  <button id="go" onclick="submitForm()">Log in</button>
  <button class="link" onclick="toggle()" id="toggleBtn">New here? Create an account</button>
</div>
<script>
let signup = false;
function toggle(){
  signup = !signup;
  document.getElementById("signupOnly").style.display = signup ? "block" : "none";
  document.getElementById("title").textContent = signup ? "Create your account" : "Log in to Mentora";
  document.getElementById("go").textContent = signup ? "Sign up" : "Log in";
  document.getElementById("toggleBtn").textContent = signup ? "Have an account? Log in" : "New here? Create an account";
  document.getElementById("msg").textContent = "";
}
async function post(url, data){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
  return {ok:r.ok, body: await r.json()};
}
async function submitForm(){
  const msg = document.getElementById("msg");
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if(signup){
    const s = await post("/signup", {name:document.getElementById("name").value, email, password, role:document.getElementById("role").value});
    if(!s.ok){ msg.textContent = s.body.error; return; }
  }
  const l = await post("/login", {email, password});
  if(!l.ok){ msg.textContent = l.body.error; return; }
  window.location.href = "/";
}
</script>
</body>
</html>
